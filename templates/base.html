<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Logged out - Pythonic Shrink{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google Fonts & Bootstrap CDN -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f8fafc;
        }
        .container {
            max-width: 400px;
            margin: 60px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            padding: 2rem 2.5rem;
        }
        h2 {
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #2d3748;
        }
        .btn-primary {
            background: #3b82f6;
            border: none;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .form-label {
            font-weight: 500;
        }
        .navbar {
            background: #3b82f6;
        }
        .navbar-brand, .nav-link, .navbar-text {
            color: #fff !important;
        }
        .footer {
            text-align: center;
            color: #aaa;
            margin-top: 2rem;
            font-size: 0.95em;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('home') }}">Pythonic Shrink</a>
            <div class="navbar-nav ms-auto">
                {% if current_user.is_authenticated %}
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    {% block content %}
    <div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 70vh;">
      <div class="card shadow p-4" style="max-width:420px; width:100%;">
        <h2 class="mb-3 text-center" style="font-weight:700;">Signed out</h2>
        <p class="text-center text-muted mb-3">You have been successfully logged out.</p>
        <a href="{{ url_for('login') }}" class="btn btn-primary w-100 mb-2">Log in again</a>
        <a href="{{ url_for('home') }}" class="btn btn-outline-secondary w-100">Go to Home</a>
      </div>
    </div>
    {% endblock %}

    <div class="footer">
        &copy; {{ 2025 }} Pythonic Shrink
    </div>
</body>
</html>
