<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pythonic-Shrink</title>
    <style>
        /* General Reset */
        body, h1, p {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
        /* Existing styles... */
            color: #333;
            display: flex;
            justify-content: center;
    {% extends "base.html" %}
    {% block title %}Shorten URL - Pythonic Shrink{% endblock %}
    {% block content %}
    <div class="container">
        <h2>Shorten Your URL</h2>
        <form method="post" action="{{ url_for('shorten_url') }}">
            <div class="mb-3">
                <label class="form-label">Long URL</label>
                <input type="url" name="long_url" class="form-control" placeholder="https://example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Custom Short URL (optional)</label>
                <input type="text" name="custom_short_url" class="form-control" maxlength="20" placeholder="e.g. my-link">
            </div>
            <div class="mb-3">
                <label class="form-label">Expiration Date (optional)</label>
                <input type="date" name="expiration_date" class="form-control">
            </div>
            <button class="btn btn-primary w-100" type="submit">Shorten</button>
        </form>
        <div class="mt-3 text-center">
            <small>View your <a href="{{ url_for('analytics', short_url='') }}">analytics</a> (enter your short URL).</small>
        </div>
    </div>
    {% endblock %}
        }

        p {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #555;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"], input[type="date"] {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="date"]:focus {
            border-color: #4CAF50;
        }

        button {
            padding: 10px;
            font-size: 1rem;
            color: #fff;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #777;
        }

        label {
            font-size: 0.9rem;
            color: #333;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pythonic-Shrink</h1>
        <p>Enter a long URL to shorten it:</p>
        <form method="post" action="/shorten">
            <label for="long_url">Enter the URL to shrink:</label>
            <input type="text" id="long_url" name="long_url" placeholder="https://example.com" required>
            
            <label for="custom_short_url">Custom Short URL (optional):</label>
            <input type="text" id="custom_short_url" name="custom_short_url" placeholder="Enter custom short URL">
            
            <label for="expiration_date">Set Expiration Date (optional):</label>
            <input type="date" id="expiration_date" name="expiration_date">
            
            <button type="submit">Shorten URL</button>
        </form>
        <footer>
            <p>Made with ❤️ by Sagar Mukhi</p>
        </footer>
    </div>
</body>
</html>
