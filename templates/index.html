{% extends "base.html" %}
{% block title %}Shorten URL - Pythonic Shrink{% endblock %}
{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card shadow p-4" style="max-width: 420px; width: 100%;">
        <h2 class="mb-3 text-center" style="font-weight:700;">Shorten Your URL</h2>
        <p class="text-center text-muted mb-4" style="font-size:1.05em;">Paste your long link below and get a short, shareable URL instantly!</p>
        <form method="post" action="{{ url_for('shorten_url') }}">
            <div class="mb-3">
                <label class="form-label">Long URL</label>
                <input type="url" name="long_url" class="form-control" placeholder="https://example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Custom Short URL <span class="text-muted">(optional)</span></label>
                <input type="text" name="custom_short_url" class="form-control" maxlength="20" placeholder="e.g. my-link">
            </div>
            <div class="mb-3">
                <label class="form-label">Expiration Date <span class="text-muted">(optional)</span></label>
                <input type="date" name="expiration_date" class="form-control">
            </div>
            <button class="btn btn-primary w-100" type="submit" style="font-weight:600;">Shorten URL</button>
        </form>
        <div class="mt-3 text-center">
            <small>Want to see stats? <a href="{{ url_for('analytics', short_url='') }}">Check analytics</a></small>
        </div>
    </div>
    <footer class="mt-4 text-muted text-center" style="font-size:0.95em;">
        Made with <span style="color:#e25555;">&#10084;</span> by Sagar Mukhi
    </footer>
</div>
{% endblock %}
