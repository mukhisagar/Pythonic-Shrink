{% extends "base.html" %}
{% block title %}Preview URL - Pythonic Shrink{% endblock %}
{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="card shadow p-4" style="max-width: 420px; width: 100%;">
        <h2 class="mb-3 text-center" style="font-weight:700;">Preview Destination</h2>
        <p class="text-center text-muted mb-4">You are about to visit:</p>
        <div class="mb-3 text-center">
            <a href="{{ long_url }}" target="_blank" class="fw-bold">{{ long_url }}</a>
        </div>
        <form method="get" action="{{ url_for('redirect_url', short_url=short_url) }}">
            <button class="btn btn-primary w-100" type="submit">Proceed to Site</button>
        </form>
        <div class="mt-3 text-center">
            <a href="{{ url_for('home') }}" class="btn btn-secondary w-100">Cancel</a>
        </div>
    </div>
</div>
<p>
    <a href="{{ short_url }}">Go to Short URL</a> |
    <a href="{{ url_for('preview_url', short_url=short_url.split('/')[-1]) }}">Preview Destination</a>
</p>
{% endblock %}
