<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <h1>Register</h1>
    <form method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <p>Username must be unique and contain only letters, numbers, or underscores.</p>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <p>Password must be at least 8 characters long and include at least one uppercase letter, one lowercase letter, and one number.</p>
        <br>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="/login">Login here</a></p>
</body>
</html>
