<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shortened URL</title>
    <style>
        /* General Reset */
        body, h1, p {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        p {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #555;
        }

        a {
            color: #1E88E5;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            background: rgba(30, 136, 229, 0.1);
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        a:hover {
            background: #1E88E5;
            color: #fff;
        }

        button {
            padding: 10px;
            font-size: 1rem;
            color: #fff;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your Shortened URL</h1>
        <p>Here is your shortened URL:</p>
        <p><a href="{{ short_url }}" target="_blank">{{ short_url }}</a></p>
        <button onclick="window.location.href='/'">Shorten Another URL</button>
        <footer>
            <p>Made with ❤️ by Sagar Mukhi</p>
        </footer>
    </div>
</body>
</html>
