{% extends "base.html" %}
{% block title %}Shortened URL - Pythonic Shrink{% endblock %}
{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="card shadow p-4" style="max-width: 420px; width: 100%;">
        <h2 class="mb-3 text-center" style="font-weight:700;">Your Shortened URL</h2>
        <p class="text-center text-muted mb-4">Share this link:</p>
        <div class="mb-3 text-center">
            <a href="{{ short_url }}" target="_blank" class="fw-bold">{{ short_url }}</a>
        </div>
        <div class="mt-3 text-center">
            <a href="{{ url_for('preview_url', short_url=short_url.split('/')[-1]) }}" class="btn btn-primary w-100">Preview Destination</a>
        </div>
        <div class="mt-3 text-center">
            <a href="{{ url_for('analytics', short_url=short_url.split('/')[-1]) }}" class="btn btn-secondary w-100">View Analytics</a>
        </div>
    </div>
</div>
{% endblock %}
